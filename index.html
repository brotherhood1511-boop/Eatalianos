<!doctype html>
<!--
  The one real HTML page. Browsers load this first; then src/main.jsx fills the
  empty <div id="root"> below with the whole site.

  What you might edit here:
    - <title>: the text on the browser tab and the main line in Google results
    - meta description: the short summary Google shows under the title
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Makes the site size itself properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Eataliano — Italian kitchen &amp; bar on Howard Avenue in Biloxi, MS. Coffee, lunch, dinner, bourbon and Italian wine, live music on the weekends." />
    <!-- Color of the phone's browser bar when someone visits the site -->
    <meta name="theme-color" content="#0E0D0B" />
    <title>Eataliano · Italian Kitchen &amp; Bar · Biloxi</title>
    <!-- The three fonts from Google Fonts:
         Mrs Saint Delafield = the gold "Eataliano" script
         Cinzel              = the headings (carved-in-stone capitals)
         EB Garamond         = the body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
